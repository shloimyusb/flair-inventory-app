<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Flair Inventory Label Scanner</title>
  <meta name="theme-color" content="#173f3b">
  <style>
    :root{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;color:#22332f;background:#f5f6f2}*{box-sizing:border-box}body{margin:0;padding:24px 16px;line-height:1.5}.wrap{max-width:720px;margin:auto;display:grid;gap:16px}.card{background:#fff;border:1px solid #dfe5df;border-radius:18px;padding:24px;box-shadow:0 6px 25px #173f3b04}h1{font-size:27px;letter-spacing:-.04em;line-height:1.2;margin:14px 0 10px}.back-link{color:#527363;font-size:12px;text-decoration:none}.camera{background:#173f3b;border-radius:14px;overflow:hidden;min-height:240px;display:grid;place-items:center}video,canvas{width:100%;max-height:65vh;object-fit:contain}.hidden{display:none!important}.btn{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:13px;font-weight:650;min-height:46px;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.primary{background:#173f3b;color:#fff}.secondary{background:#edf4f0;color:#173f3b}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.result,.manual{display:grid;grid-template-columns:1fr 1fr;gap:10px}.manual{margin-top:20px}.field{background:#f1f5ed;border-radius:12px;padding:12px}.field small{display:block;color:#7e8b80;font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}.field strong{font-size:25px;letter-spacing:-.03em}.status{font-size:13px;color:#6a7772}label{display:grid;gap:7px;font-size:12px;color:#66796b}input{width:100%;min-width:0;border:1px solid #dfe5df;border-radius:12px;padding:12px 13px;font:inherit;font-size:16px;min-height:44px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #418e7d;outline-offset:3px}@media(max-width:560px){.card{padding:18px}.camera{min-height:220px}.field{padding:10px}.field strong{font-size:22px}}
  </style>
  <style>.scan-type{margin-top:16px;max-width:260px}select{font:inherit;font-size:16px;min-height:44px;border:1px solid #dfe5df;border-radius:10px;padding:10px;background:white;color:inherit}.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.suggestions button{font:inherit;font-size:12px;border:1px solid #dfe5df;border-radius:9px;background:#f5f7f2;color:#365e50;text-align:left;padding:9px 11px;max-width:100%;overflow-wrap:anywhere;cursor:pointer}.suggestions button[aria-pressed="true"]{background:#e6efe7;border-color:#719480}.suggestions button small{display:block;color:#6a7772;font-size:10px;margin-bottom:3px}.scan-copy{font-size:12px;color:#6a7772;margin-top:16px}.label-text{margin:16px 0;font-size:12px;color:#6a7772}.label-text summary{cursor:pointer;padding:8px 0}textarea{font:inherit;font-size:14px;width:100%;min-height:120px;border:1px solid #dfe5df;border-radius:10px;padding:12px;background:#f8faf6;resize:vertical}.result.single{grid-template-columns:1fr}.manual.single{grid-template-columns:1fr}</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <a class="back-link" href="app.html">← Back to inventory</a>
      <label class="scan-type">Label type<select id="scanCategory"><option value="carpet">Carpet</option><option value="tile">Tile</option><option value="vinyl">Vinyl</option></select></label>
      <h1 id="scannerTitle">Scan Label</h1>
      <p id="scanHelp" class="status"></p>
      <div class="camera"><video id="video" playsinline autoplay></video><canvas id="canvas" class="hidden"></canvas></div>
      <p id="status" class="status" role="status" aria-live="polite">Starting camera…</p>
      <div class="actions"><button id="capture" class="btn primary" disabled>Capture & Read</button><button id="retry" class="btn secondary">Restart Camera</button></div>
      <label>Or upload a label photo<input id="photoInput" type="file" accept="image/*"></label>
    </div>

    <div id="resultCard" class="card">
      <div id="scanResultFields" class="result">
        <div class="field"><small id="codeLabel">Name / product code</small><strong id="codeText">—</strong></div>
        <div id="thicknessResult" class="field"><small>Thickness</small><strong id="thicknessText">—</strong></div>
      </div>
      <p class="scan-copy">Check the detected text or choose another suggestion, then search for the matching item.</p>
      <div id="scanSuggestions" class="suggestions" role="group" aria-label="Detected label text"></div>
      <div id="manualFields" class="manual">
        <label><span id="queryLabel">Search name or code</span><input id="codeInput" maxlength="80" autocomplete="off" autocapitalize="none"></label>
        <label id="thicknessField">Correct thickness (mm)<input id="thicknessInput" inputmode="decimal" maxlength="20"></label>
      </div>
      <details id="rawLabel" class="label-text hidden"><summary>Read label text</summary><label>Detected text<textarea id="labelText" readonly></textarea></label></details>
      <div class="actions" style="margin-top:12px"><button id="useResult" class="btn primary">Search inventory</button><button id="scanAgain" class="btn secondary">Scan Again</button></div>
    </div>
  </div>
  <script src="label-reader.js"></script>
  <script>
    let stream=null,ocrLoading=null,reading=false,cameraRequest=0;
    let lastLabelText='';
    const $=id=>document.getElementById(id);
    function currentCategory(){return labelScanCategory($('scanCategory').value);}
    function selectSearchText(value){
      $('codeInput').value=value;$('codeText').textContent=value||'—';
      $('scanSuggestions').querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.query===value)));
    }
    function showLabelSuggestions(text){
      const category=currentCategory(),suggestions=labelScanCandidates(text,category),container=$('scanSuggestions');container.replaceChildren();
      for(const suggestion of suggestions){const button=document.createElement('button'),label=document.createElement('small'),value=document.createElement('span');button.type='button';button.dataset.query=suggestion.value;label.textContent=suggestion.label;value.textContent=suggestion.value;button.append(label,value);button.addEventListener('click',()=>selectSearchText(suggestion.value));container.appendChild(button);}
      selectSearchText(suggestions[0]?.value||'');
      const thickness=category==='vinyl'?labelScanThickness(text):'';
      $('thicknessInput').value=thickness;$('thicknessText').textContent=thickness?thickness+' mm':'—';
      $('labelText').value=text;$('rawLabel').classList.toggle('hidden',!text);
    }
    function configureScanCategory(){
      const category=currentCategory(),name=category[0].toUpperCase()+category.slice(1),vinyl=category==='vinyl';
      $('scannerTitle').textContent='Scan '+name+' Label';document.title='Flair '+name+' Label Scanner';
      $('scanHelp').textContent=category==='carpet'?'Photograph the product name, style or roll code on the carpet label.':category==='tile'?'Photograph the tile name or manufacturer SKU / item code on the box.':'Photograph the product code and overall thickness, such as 1194-1 and 4.5 mm.';
      $('codeLabel').textContent=vinyl?'Product code':'Name / product code';$('queryLabel').textContent=vinyl?'Correct code':'Search name or code';
      for(const id of ['thicknessResult','thicknessField'])$(id).classList.toggle('hidden',!vinyl);
      for(const id of ['scanResultFields','manualFields'])$(id).classList.toggle('single',!vinyl);
      const base=new URLSearchParams(location.search).get('returnUrl')||'https://shloimyusb.github.io/flair-inventory-app/app.html';
      document.querySelector('.back-link').href=labelScanReturnUrl(base,category,'','')||'app.html';
      showLabelSuggestions(lastLabelText);
    }
    async function startCamera(){
      if(reading)return;
      stopCamera(); $('status').textContent='Starting camera… You can also upload a photo or enter a code below.';
      const request=cameraRequest;
      try{const opened=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(request!==cameraRequest || reading){opened.getTracks().forEach(t=>t.stop());return;}stream=opened;$('video').srcObject=stream;$('status').textContent='Camera ready.';$('capture').disabled=false;}
      catch(e){if(request!==cameraRequest)return;$('status').textContent='Camera access was blocked. You can still enter the code and thickness manually.';$('resultCard').classList.remove('hidden')}
    }
    function stopCamera(){cameraRequest++;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('capture').disabled=true;}
    function loadOcr(){
      if(!ocrLoading)ocrLoading=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';script.onload=resolve;script.onerror=()=>{script.remove();ocrLoading=null;reject(new Error('Could not load label reader'));};document.head.appendChild(script);});
      return ocrLoading;
    }
    async function capture(){
      const v=$('video'),c=$('canvas'); if(!v.videoWidth){$('status').textContent='Camera is not ready yet.';return}
      c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0,c.width,c.height);stopCamera();await readLabel(c);
    }
    async function readLabel(source){
      if(reading)return;reading=true;lastLabelText='';showLabelSuggestions('');for(const id of ['capture','retry','scanAgain','photoInput','scanCategory','useResult'])$(id).disabled=true;
      $('status').textContent='Reading label…';
      try{
        await loadOcr();
        const r=await Tesseract.recognize(source,'eng',{logger:m=>{if(m.status==='recognizing text')$('status').textContent=`Reading label… ${Math.round((m.progress||0)*100)}%`}});
        lastLabelText=String(r.data.text||'').slice(0,6000);showLabelSuggestions(lastLabelText);
        $('resultCard').classList.remove('hidden');$('status').textContent=$('codeInput').value?'Check the result before searching inventory.':'No product text found. Enter a name or code below, or try another photo.';
      }catch(e){$('status').textContent='Could not read the label. Try again with less glare or enter it manually.';$('resultCard').classList.remove('hidden')}
      finally{reading=false;for(const id of ['retry','scanAgain','photoInput','scanCategory','useResult'])$(id).disabled=false;$('capture').disabled=!stream;}
    }
    function sendResult(){
      if(reading)return;
      const category=currentCategory(),code=labelScanText($('codeInput').value).slice(0,80),thickness=category==='vinyl'?$('thicknessInput').value.trim():'';
      if(!code && !thickness){$('status').textContent='Enter a product name or code first.';return}
      const returnUrl=new URLSearchParams(location.search).get('returnUrl');
      const destination=labelScanReturnUrl(returnUrl||'https://shloimyusb.github.io/flair-inventory-app/app.html',category,code,thickness);
      if(destination){stopCamera();location.assign(destination);return;}
      const params=new URLSearchParams(location.search),origin=params.get('returnOrigin'),nonce=params.get('nonce');
      if(window.opener && origin && /^https:\/\/([a-z0-9-]+-script\.googleusercontent\.com|script\.google\.com)$/.test(origin)){window.opener.postMessage({type:'flair-inventory-scan',category,code,thickness,nonce},origin);window.close()} else {$('status').textContent='Open this scanner from Flair Inventory to return the result.'}
    }
    $('scanCategory').value=labelScanCategory(new URLSearchParams(location.search).get('category'));configureScanCategory();
    $('scanCategory').addEventListener('change',configureScanCategory);
    $('codeInput').addEventListener('input',()=>{$('codeText').textContent=$('codeInput').value||'—';});
    $('photoInput').addEventListener('change',e=>{const file=e.target.files[0];if(file){stopCamera();readLabel(file)}});
    $('capture').addEventListener('click',capture);$('retry').addEventListener('click',startCamera);$('scanAgain').addEventListener('click',startCamera);$('useResult').addEventListener('click',sendResult);window.addEventListener('pagehide',stopCamera);startCamera();
  </script>
</body>
</html>
