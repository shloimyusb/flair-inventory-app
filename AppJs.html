<script>
const state = {
  token: readLoginToken(),
  user: null,
  category: 'carpet',
  inventory: [],
  allInventory: [],
  inventoryRequest: 0,
  loadedCategories: {},
  pendingCategories: {},
  categoryRevisions: {},
  visibleCount: 60,
  viewMode: 'cards',
  carpetSheets: [],
  inventorySheets: {},
  moveItem: null,
  moveSaving: false,
  adjustItem: null,
  adjustAction: 'add',
  scannerUrl: '',
  vinylConfigured: false,
};

const $ = id => document.getElementById(id);
function readLoginToken(){
  for(const name of ['sessionStorage','localStorage']){try{const token=window[name].getItem('flairInventoryToken');if(token)return token;}catch(e){}}
  return '';
}
function clearLoginToken(){
  for(const name of ['sessionStorage','localStorage']){try{window[name].removeItem('flairInventoryToken');}catch(e){}}
}
function storeLoginToken(token,remember){
  clearLoginToken();
  try {window[remember?'localStorage':'sessionStorage'].setItem('flairInventoryToken',token);return true;}catch(e){return false;}
}
const call = (fn, ...args) => new Promise((resolve, reject) => {
  google.script.run.withSuccessHandler(resolve).withFailureHandler(err => reject(new Error(err.message || err)))[fn](...args);
});

window.addEventListener('load', async () => {
  bindEvents();
  window.addEventListener('message', handleScannerMessage);
  if (state.token) {
    $('loginForm').classList.add('hidden');$('restoreStatus').classList.remove('hidden');
    try { await bootstrap(); return; } catch (e) {
      if(/expired|revoked|sign in again/i.test(e.message)){clearLoginToken();state.token='';}
      else toast('Could not connect. Refresh to retry your saved login.',true);
    }
  }
  showLogin();
});

function bindEvents(){
  $('loginForm').addEventListener('submit', login);
  $('logoutBtn').addEventListener('click', logout);
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
  document.querySelectorAll('.category-btn').forEach(b=>b.addEventListener('click',()=>switchCategory(b.dataset.category)));
  $('searchInput').addEventListener('input', applyInventoryFilters);
  $('bayFilter').addEventListener('change', applyInventoryFilters);
  $('locationFilter').addEventListener('change', applyInventoryFilters);
  $('sortOrder').addEventListener('change', applyInventoryFilters);
  $('inventoryViewMode').addEventListener('change',()=>setInventoryView($('inventoryViewMode').value));
  $('refreshBtn').addEventListener('click',()=>loadInventory(true));
  $('historyRefreshBtn').addEventListener('click',loadHistory);
  $('addRollBtn').addEventListener('click',openRollDialog);
  $('saveRollBtn').addEventListener('click',saveRoll);
  document.querySelectorAll('.segment').forEach(b=>b.addEventListener('click',()=>setAdjustAction(b.dataset.action)));
  $('saveAdjustBtn').addEventListener('click',saveAdjustment);
  $('moveForm').addEventListener('submit',saveMove);
  document.querySelectorAll('[data-close-move]').forEach(b=>b.addEventListener('click',()=>$('moveDialog').close()));
  $('scanBtn').addEventListener('click',openScanner);
}

async function login(e){
  e.preventDefault();
  setBusy(e.submitter,true,'Signing in…');
  try{
    const result = await call('loginUser',$('loginEmail').value,$('loginPin').value,$('rememberMe').checked);
    state.token=result.token; state.user=result.user;
    if(!storeLoginToken(state.token,result.remembered))toast('Signed in, but this browser could not save your login.',true);
    $('loginPin').value='';
    await bootstrap();
  }catch(err){toast(err.message,true)}finally{setBusy(e.submitter,false,'Sign in')}
}

async function bootstrap(){
  const data = await call('getAppBootstrap',state.token);
  state.loadedCategories={carpet:{items:data.inventory||[],loadedAt:Date.now()}};
  state.pendingCategories={};
  state.categoryRevisions={};
  state.user=data.user; state.carpetSheets=data.carpetSheets||[]; state.scannerUrl=data.scannerUrl||'';
  state.viewMode=readInventoryView(state.user.email);$('inventoryViewMode').value=state.viewMode;
  state.inventorySheets=data.inventorySheets||{carpet:state.carpetSheets};
  state.vinylConfigured=!!data.vinylConfigured;
  $('testBanner').classList.toggle('hidden',data.environment==='production');
  if(state.scannerUrl){const url=new URL(state.scannerUrl);url.searchParams.set('returnUrl',data.appUrl);$('scanBtn').href=url.toString();}
  $('userName').textContent=state.user.name;
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  populateRollSheets();
  const scan=[$('initialScanCode').value,$('initialScanThickness').value].filter(Boolean).join(' ');
  if(scan){switchCategory('vinyl');$('searchInput').value=scan;$('initialScanCode').value='';$('initialScanThickness').value='';}
  else {await switchCategory('carpet');}
  // Warm the other tabs while the employee is viewing the first category.
  fetchInventoryCategory('tile',false).catch(()=>{});
  if(state.vinylConfigured)fetchInventoryCategory('vinyl',false).catch(()=>{});
}

function showLogin(){ $('loginForm').classList.remove('hidden');$('restoreStatus').classList.add('hidden');$('loginView').classList.remove('hidden'); $('appView').classList.add('hidden'); }
async function logout(){ try{await call('logoutUser',state.token)}catch(e){toast('Could not complete server sign-out. Your saved login has been cleared on this browser.',true);}clearLoginToken();state.token='';state.user=null;state.loadedCategories={};state.pendingCategories={};state.allInventory=[];state.inventory=[];$('rememberMe').checked=false;showLogin(); }

function switchView(view){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
  $('inventoryView').classList.toggle('hidden',view!=='inventory'); $('historyView').classList.toggle('hidden',view!=='history');
  if(view==='history') loadHistory();
}

function switchCategory(category){
  state.category=category; $('searchInput').value='';
  $('bayFilter').value='';$('locationFilter').value='';state.allInventory=[];
  document.querySelectorAll('.category-btn').forEach(b=>b.classList.toggle('active',b.dataset.category===category));
  $('addRollBtn').classList.toggle('hidden',category!=='carpet');
  $('scanBtn').classList.toggle('hidden',category!=='vinyl');
  return loadInventory(false);
}

async function loadInventory(force){
  const requestId=++state.inventoryRequest,category=state.category;
  if(category==='vinyl' && !state.vinylConfigured){state.inventory=[];state.allInventory=[];populateBayFilter();populateLocationFilter([]);$('bayFilter').disabled=true;$('locationFilter').disabled=true;$('statusLine').textContent='Vinyl sheet not connected yet.';$('inventoryGrid').innerHTML='<div class="card">Vinyl inventory will be available when its Google Sheet is connected. You can still test the label scanner.</div>';return}
  const loaded=state.loadedCategories[category];
  if(loaded){
    state.allInventory=loaded.items;populateBayFilter();$('bayFilter').disabled=false;$('locationFilter').disabled=false;applyInventoryFilters();
    if(!force && Date.now()-loaded.loadedAt<120000)return;
    $('statusLine').textContent+=force?' · Refreshing…':' · Checking for updates…';
  } else {
    state.inventory=[];state.allInventory=[];populateBayFilter();populateLocationFilter([]);$('bayFilter').disabled=true;$('locationFilter').disabled=true;
    $('inventoryGrid').innerHTML='<div class="card">Loading '+esc(category)+' inventory…</div>';
    $('statusLine').textContent='Loading…';
  }
  try{
    const items=await fetchInventoryCategory(category,!!force);
    if(requestId!==state.inventoryRequest || category!==state.category)return;
    state.allInventory=items;populateBayFilter();$('bayFilter').disabled=false;$('locationFilter').disabled=false;applyInventoryFilters();
  }catch(err){
    if(requestId!==state.inventoryRequest || category!==state.category)return;
    $('statusLine').textContent=loaded?'Showing previously loaded inventory · Refresh failed':'Could not load '+category+' inventory. Try Refresh.';
    toast(err.message,true);
  }
}

function fetchInventoryCategory(category,force){
  const pending=state.pendingCategories[category];
  if(pending){
    if(!force || pending.force)return pending.promise;
    return pending.promise.catch(()=>{}).then(()=>fetchInventoryCategory(category,true));
  }
  const token=state.token,revision=state.categoryRevisions[category]||0,job={force:!!force};
  state.pendingCategories[category]=job;
  job.promise=call('getInventory',token,category,'',!!force).then(items=>{
    if(state.token!==token)throw new Error('Session changed. Please sign in again.');
    if((state.categoryRevisions[category]||0)!==revision && state.loadedCategories[category])return state.loadedCategories[category].items;
    // Keep completed preloads even if the employee has moved to another tab.
    state.loadedCategories[category]={items,loadedAt:Date.now()};return items;
  }).finally(()=>{if(state.pendingCategories[category]===job)delete state.pendingCategories[category];});
  return job.promise;
}

function populateBayFilter(){
  const selected=$('bayFilter').value;
  const bays=[...new Set(state.allInventory.map(item=>item.sourceSheet).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
  $('bayFilter').innerHTML='<option value="">All bays</option>'+bays.map(bay=>`<option value="${escAttr(bay)}">${esc(bay)} (${state.allInventory.filter(item=>item.sourceSheet===bay).length})</option>`).join('');
  $('bayFilter').value=bays.includes(selected)?selected:'';
}

function applyInventoryFilters(){
  if(state.category==='vinyl' && !state.vinylConfigured)return;
  const bay=$('bayFilter').value,terms=$('searchInput').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const bayItems=state.allInventory.filter(item=>!bay || item.sourceSheet===bay);
  populateLocationFilter(bayItems);
  const location=$('locationFilter').value;
  state.inventory=bayItems.filter(item=>(!location || locationKey(item)===location) && terms.every(term=>JSON.stringify(item).toLowerCase().includes(term)));
  state.inventory.sort((a,b)=>compareInventoryItems(a,b,$('sortOrder').value));
  state.visibleCount=60;
  renderInventory();
  $('statusLine').textContent=`${state.inventory.length} of ${state.allInventory.length} ${state.category} item${state.inventory.length===1?'':'s'}${bay?' · '+bay:''}${location?' · Location '+(location==='__NO_LOCATION__'?'not set':location):''}`;
}

function locationKey(item){return String(item.location||'').trim() || '__NO_LOCATION__';}
function populateLocationFilter(items){
  const selected=$('locationFilter').value;
  const locations=[...new Set(items.map(locationKey))].sort((a,b)=>a==='__NO_LOCATION__'?1:b==='__NO_LOCATION__'?-1:a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
  $('locationFilter').innerHTML='<option value="">All locations</option>'+locations.map(location=>`<option value="${escAttr(location)}">${location==='__NO_LOCATION__'?'Not set':esc(location)} (${items.filter(item=>locationKey(item)===location).length})</option>`).join('');
  $('locationFilter').value=locations.includes(selected)?selected:'';
}
function compareInventoryItems(a,b,mode){
  const byName=()=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'});
  if(mode.startsWith('quantity-')){
    const aq=Number.isFinite(a.quantity)?a.quantity:null,bq=Number.isFinite(b.quantity)?b.quantity:null;
    if(aq===null || bq===null)return aq===bq?byName():aq===null?1:-1;
    return (mode==='quantity-desc'?bq-aq:aq-bq) || byName();
  }
  if(mode.startsWith('location-')){
    const direction=mode==='location-desc'?-1:1;
    const ab=String(a.sourceSheet||'').trim(),bb=String(b.sourceSheet||'').trim();
    if(!ab || !bb){if(ab!==bb)return !ab?1:-1;}
    const bayOrder=ab.localeCompare(bb,undefined,{numeric:true,sensitivity:'base'});
    if(bayOrder)return direction*bayOrder;
    const al=String(a.location||'').trim(),bl=String(b.location||'').trim();
    if(!al || !bl)return al===bl?byName():!al?1:-1;
    return direction*al.localeCompare(bl,undefined,{numeric:true,sensitivity:'base'}) || byName();
  }
  return (mode==='name-desc'?-1:1)*byName();
}

function inventoryViewKey(email){return 'flairInventoryView:'+String(email||'').trim().toLowerCase();}
function readInventoryView(email){
  try {const value=window.localStorage.getItem(inventoryViewKey(email));return ['cards','compact','table'].includes(value)?value:'cards';}catch(error){return 'cards';}
}
function setInventoryView(value){
  state.viewMode=['cards','compact','table'].includes(value)?value:'cards';
  $('inventoryViewMode').value=state.viewMode;
  try {window.localStorage.setItem(inventoryViewKey(state.user.email),state.viewMode);}catch(error){}
  if(state.loadedCategories[state.category])renderInventory();
}

function inventoryQuantity(item){
  if(item.category==='carpet')return {qty:`${esc(item.quantityDisplay||'—')} <small>ft</small>`,sub:item.quantityMode==='dimension'?'Dimension-format remnant':''};
  return {qty:`${esc(item.boxes??'—')} <small>boxes</small>`,sub:item.totalSf!=null?`${fmt(item.totalSf)} SF total${item.sfPerBox?` · ${fmt(item.sfPerBox)} SF/box`:''}`:''};
}
function inventoryMeta(item){
  const meta=[];
  if(item.sku)meta.push(['SKU',item.sku]);if(item.code)meta.push(['Code',item.code]);if(item.thickness)meta.push(['Thickness',item.thickness]);
  meta.push(['Location',item.location||'Not set']);if(item.sourceSheet)meta.push(['Bay',item.sourceSheet]);
  if(item.bay)meta.push(['Bay notes',item.bay]);if(item.side)meta.push(['Side',item.side]);if(item.grout)meta.push(['Grout',item.grout]);
  if(item.category==='carpet'){meta.push(['Confirmed',String(item.confirmed).toLowerCase()==='true'?'Yes':'Not yet']);if(item.timestamp)meta.push(['Sheet date',item.timestamp]);}
  return meta;
}
function inventoryMetaField(item,label,value){
  return ['Location','Bay','Bay notes'].includes(label) && state.user.role!=='view'?`<button type="button" class="meta-edit" data-move="${escAttr(label)}" aria-label="Change ${escAttr(label.toLowerCase())} for ${escAttr(item.name)}"><b>${esc(label)} <span aria-hidden="true">✎</span></b>${esc(value)}</button>`:`<div><b>${esc(label)}</b>${esc(value)}</div>`;
}
function inventoryActions(item){
  if(state.user.role==='view')return '<span class="muted">View only</span>';
  return `<div class="card-actions"><button type="button" class="btn secondary" data-adjust="add">+ Add</button><button type="button" class="btn ghost" data-adjust="subtract">− Subtract</button></div>${item.category==='carpet'?`<button type="button" class="btn ghost confirm-action" data-confirm>${String(item.confirmed).toLowerCase()==='true'?'✓ Confirm again':'✓ Confirm carpet'}</button>`:''}`;
}
function bindInventoryItem(element,item){
  element.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>openMove(item,b.dataset.move)));
  element.querySelectorAll('[data-adjust]').forEach(b=>b.addEventListener('click',()=>openAdjust(item,b.dataset.adjust)));
  const confirm=element.querySelector('[data-confirm]');if(confirm)confirm.addEventListener('click',()=>saveCarpetConfirmation(item,confirm));
}
function renderInventoryTable(grid){
  const wrap=document.createElement('div');wrap.className='inventory-table-wrap';wrap.tabIndex=0;wrap.setAttribute('aria-label','Scrollable inventory table');
  wrap.innerHTML=`<table class="inventory-data-table"><caption>${esc(state.category)} inventory</caption><thead><tr><th scope="col">Item</th><th scope="col">Amount</th><th scope="col">Bay</th><th scope="col">Location</th><th scope="col">Details</th><th scope="col">Actions</th></tr></thead><tbody></tbody></table>`;
  const body=wrap.querySelector('tbody');
  state.inventory.slice(0,state.visibleCount).forEach(item=>{
    const row=document.createElement('tr'),{qty,sub}=inventoryQuantity(item);
    const details=inventoryMeta(item).filter(m=>!['Location','Bay'].includes(m[0]));
    row.innerHTML=`<th scope="row">${esc(item.name)}${item.estimated?'<span class="badge warn">Estimated</span>':''}</th><td><div class="table-qty">${qty}</div>${sub?`<div class="table-sub">${esc(sub)}</div>`:''}</td><td class="table-place">${inventoryMetaField(item,'Bay',item.sourceSheet||'Not set')}</td><td class="table-place">${inventoryMetaField(item,'Location',item.location||'Not set')}</td><td>${details.length?`<details><summary>Details</summary><div class="meta">${details.map(m=>inventoryMetaField(item,...m)).join('')}</div></details>`:'—'}</td><td class="table-actions">${inventoryActions(item)}</td>`;
    bindInventoryItem(row,item);body.appendChild(row);
  });
  const hint=document.createElement('p');hint.className='table-scroll-hint';hint.textContent='Swipe sideways to see all columns.';grid.append(hint,wrap);
}

function renderInventory(){
  const grid=$('inventoryGrid'); grid.className='inventory-grid inventory-'+state.viewMode;grid.innerHTML='';
  if(!state.inventory.length){grid.innerHTML='<div class="card"><strong>No inventory found.</strong></div>';return}
  if(state.viewMode==='table')renderInventoryTable(grid);
  else state.inventory.slice(0,state.visibleCount).forEach(item=>{
    const card=document.createElement('article'); card.className='card';
    const est=item.estimated?'<span class="badge warn">Estimated</span>':'';
    const {qty,sub}=inventoryQuantity(item),meta=inventoryMeta(item);
    if(sub)card.classList.add('has-subqty');
    card.innerHTML=`<div class="card-title"><h3>${esc(item.name)}</h3>${est}</div><div class="qty">${qty}</div>${sub?`<div class="subqty">${esc(sub)}</div>`:''}<div class="meta">${meta.map(m=>inventoryMetaField(item,...m)).join('')}</div><div class="inventory-actions">${inventoryActions(item)}</div>`;
    bindInventoryItem(card,item);
    grid.appendChild(card);
  });
  if(state.inventory.length>state.visibleCount){
    const more=document.createElement('div');more.style.gridColumn='1 / -1';more.className='card inventory-more';
    const info=document.createElement('span');info.textContent=`Showing ${state.visibleCount} of ${state.inventory.length} matching items. Search and filters include all items.`;
    const button=document.createElement('button');button.className='btn secondary';button.textContent='Show more items';button.addEventListener('click',()=>{state.visibleCount+=60;renderInventory();});
    more.append(info,button);grid.appendChild(more);
  }
}

async function saveCarpetConfirmation(item,button){
  const label=button.textContent,token=state.token;setBusy(button,true,'Confirming…');
  try {
    const result=await call('confirmCarpet',token,item.id);
    if(state.token!==token)return;
    state.categoryRevisions.carpet=(state.categoryRevisions.carpet||0)+1;
    const cached=state.loadedCategories.carpet;
    if(cached){cached.items=cached.items.map(row=>row.id===item.id?result.item:row);}
    if(state.category==='carpet'){
      state.allInventory=state.allInventory.map(row=>row.id===item.id?result.item:row);applyInventoryFilters();
    }
    toast('Carpet confirmed. Checkbox and sheet date updated.');
  } catch(error){toast(error.message,true);} finally {setBusy(button,false,label);}
}

function openMove(item,field){
  if(state.user.role==='view'){toast('Your account is view-only.',true);return;}
  if(state.moveSaving){toast('Your previous move is still saving.');return;}
  state.moveItem=item;
  $('moveTitle').textContent='Move '+item.name;
  const sheets=[...new Set([...(state.inventorySheets[item.category]||[]),item.sourceSheet])];
  $('moveSheet').innerHTML=sheets.map(s=>`<option value="${escAttr(s)}">${esc(s)}</option>`).join('');
  $('moveSheet').value=item.sourceSheet;$('moveLocation').value=item.location||'';$('moveBay').value=item.bay||'';
  $('moveBayLabel').classList.toggle('hidden',item.category!=='carpet' && !Object.hasOwn(item,'bay'));
  $('moveDialog').showModal();
  $(field==='Location'?'moveLocation':field==='Bay notes'?'moveBay':'moveSheet').focus();
}

async function saveMove(event){
  event.preventDefault();if(state.moveSaving)return;
  const item=state.moveItem,token=state.token,button=$('saveMoveBtn');
  const payload={category:item.category,inventoryId:item.id,sheetName:$('moveSheet').value,location:$('moveLocation').value,bay:$('moveBay').value,expected:{sourceSheet:item.sourceSheet,location:item.location,bay:item.bay||''}};
  state.moveSaving=true;setBusy(button,true,'Saving…');
  try {
    const result=await call('moveInventory',token,payload);
    if(state.token!==token)return;
    state.categoryRevisions[item.category]=(state.categoryRevisions[item.category]||0)+1;
    const cached=state.loadedCategories[item.category];
    if(cached)cached.items=cached.items.map(row=>row.id===item.id?result.item:row);
    if(state.category===item.category){state.allInventory=state.allInventory.map(row=>row.id===item.id?result.item:row);populateBayFilter();applyInventoryFilters();}
    $('moveDialog').close();
    toast(result.unchanged?'Location is already up to date.':`Saved: ${result.item.sourceSheet} · Location ${result.item.location||'not set'}.`);
  }catch(error){toast(error.message,true);}finally{state.moveSaving=false;setBusy(button,false,'Save location');}
}

function openAdjust(item,action){
  if(state.user.role==='view'){toast('Your account is view-only.',true);return}
  state.adjustItem=item; setAdjustAction(action);
  $('adjustTitle').textContent=`Adjust ${item.name}`;
  $('adjustAmount').value=''; $('adjustReason').value=''; $('adjustNotes').value='';
  $('adjustAmount').step=item.category==='carpet'?'0.01':'1';
  $('adjustCurrent').innerHTML=`Current: <strong>${item.category==='carpet'?esc(item.quantityDisplay||'—')+' ft':`${item.boxes??'—'} boxes${item.totalSf!=null?` (${fmt(item.totalSf)} SF)`:''}`}</strong>`;
  $('adjustDialog').showModal();
}
function setAdjustAction(action){state.adjustAction=action;document.querySelectorAll('.segment').forEach(b=>b.classList.toggle('active',b.dataset.action===action))}

async function saveAdjustment(){
  const btn=$('saveAdjustBtn'); const amount=Number($('adjustAmount').value);
  if(!amount||amount<=0){toast('Enter a quantity greater than zero.',true);return}
  setBusy(btn,true,'Saving…');
  try{
    const result=await call('adjustInventory',state.token,{category:state.adjustItem.category,inventoryId:state.adjustItem.id,action:state.adjustAction,amount,reason:$('adjustReason').value,notes:$('adjustNotes').value});
    $('adjustDialog').close(); toast(`Updated from ${result.before} to ${result.after}.`); await loadInventory(true);
  }catch(err){toast(err.message,true)}finally{setBusy(btn,false,'Save adjustment')}
}

function populateRollSheets(){
  $('rollSheet').innerHTML=state.carpetSheets.map(s=>`<option value="${escAttr(s)}">${esc(s)}</option>`).join('');
}
function openRollDialog(){ if(state.user.role==='view'){toast('Your account is view-only.',true);return} $('rollForm').reset(); populateRollSheets(); $('rollDialog').showModal(); }
async function saveRoll(){
  const btn=$('saveRollBtn'); setBusy(btn,true,'Adding…');
  try{
    const result=await call('addCarpetRoll',state.token,{name:$('rollName').value,sheetName:$('rollSheet').value,location:$('rollLocation').value,bay:$('rollBay').value,originalQty:Number($('rollOriginal').value),currentQty:Number($('rollCurrent').value),estimated:$('rollEstimated').checked,price:$('rollPrice').value,sample:$('rollSample').value,reprice:$('rollReprice').value,photo:$('rollPhoto').value,confirmed:$('rollConfirmed').checked,notes:$('rollNotes').value});
    $('rollDialog').close(); toast(`${result.name} added to ${result.sheetName}.`); await loadInventory(true);
  }catch(err){toast(err.message,true)}finally{setBusy(btn,false,'Add roll')}
}

async function loadHistory(){
  $('historyList').innerHTML='<div class="history-row">Loading…</div>';
  try{
    const rows=await call('getHistory',state.token,200);
    $('historyList').innerHTML=rows.length?rows.map(r=>`<div class="history-row"><div><strong>${esc(r.product)}</strong><br><span class="muted">${esc(r.timestamp)} · ${esc(r.category)}</span></div><div><b>${esc(r.action)}</b><br>${esc(r.amount)} ${esc(r.unit)}</div><div>${esc(r.before)} → ${esc(r.after)}</div><div>${esc(r.employee)}</div><div>${esc(r.sourceSheet)}</div></div>`).join(''):'<div class="history-row">No history yet.</div>';
  }catch(err){toast(err.message,true)}
}

function openScanner(event){
  if(!state.scannerUrl){event.preventDefault();toast('The camera scanner is not configured yet. You can still search vinyl manually.',true);}
}
function handleScannerMessage(event){
  if(!state.scannerUrl)return;
  let expectedOrigin='';
  try{expectedOrigin=new URL(state.scannerUrl).origin}catch(e){}
  if(expectedOrigin && event.origin!==expectedOrigin)return;
  const data=event.data||{};
  if(data.type!=='flair-vinyl-scan' || event.source!==state.scannerWindow || data.nonce!==state.scanNonce)return;
  const code=String(data.code||'').trim(); const thickness=String(data.thickness||'').trim();
  if(!code && !thickness){toast('No code or thickness was detected.',true);return}
  $('searchInput').value=[code,thickness].filter(Boolean).join(' ');
  toast(`Scanner read ${code||'unknown code'}${thickness?` · ${thickness} mm`:''}.`);
  loadInventory(true);
}

function setBusy(btn,busy,label){if(!btn)return;btn.disabled=busy;btn.textContent=label}
function toast(msg,error){const t=$('toast');t.textContent=msg;t.style.background=error?'#991b1b':'#111827';t.classList.remove('hidden');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.add('hidden'),3200)}
function debounce(fn,ms){let id;return(...args)=>{clearTimeout(id);id=setTimeout(()=>fn(...args),ms)}}
function fmt(v){return Number(v).toLocaleString(undefined,{maximumFractionDigits:2})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(v){return esc(v)}
</script>
