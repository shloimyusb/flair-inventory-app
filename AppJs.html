<script>
const state = {
  token: readLoginToken(),
  user: null,
  category: 'carpet',
  inventory: [],
  allInventory: [],
  inventoryRequest: 0,
  loadedCategories: {},
  pendingCategories: {},
  categoryRevisions: {},
  visibleCount: 60,
  viewMode: 'cards',
  cardSize: 285,
  carpetSheets: [],
  inventorySheets: {},
  moveItem: null,
  moveSaving: false,
  adjustItem: null,
  adjustAction: 'add',
  scannerUrl: '',
  vinylConfigured: false,
  historyCache: null,
  historyPending: null,
  historyRevision: 0,
  adjustSaving: false,
  rollSaving: false,
};

const $ = id => document.getElementById(id);
const searchTextCache = new WeakMap();
function readLoginToken(){
  return localLoginTokens()[0]||'';
}
function localLoginTokens(){
  const tokens=[];
  for(const name of ['localStorage','sessionStorage'])try{const token=window[name].getItem('flairInventoryToken');if(token && !tokens.includes(token))tokens.push(token);}catch(error){}
  return tokens;
}
function clearLocalLoginToken(token){
  for(const name of ['sessionStorage','localStorage'])try{if(!token || window[name].getItem('flairInventoryToken')===token)window[name].removeItem('flairInventoryToken');}catch(error){}
}
function loginHostNonce(){
  try{const nonce=document.getElementById('initialLoginHostNonce').value;return /^[a-f0-9]{64}$/.test(nonce)?nonce:'';}catch(error){return '';}
}
function loginHostRequest(action,details){
  const nonce=loginHostNonce();if(!nonce)return Promise.resolve(null);
  return new Promise(resolve=>{
    const id=window.flairLoginRequestId=(window.flairLoginRequestId||0)+1;
    const finish=result=>{clearTimeout(timer);window.removeEventListener('message',receive);resolve(result);};
    const receive=event=>{const data=event.data;if(event.source===window.top && event.origin==='https://shloimyusb.github.io' && data && data.type==='flair-login-response' && data.nonce===nonce && data.id===id)finish(data);};
    const timer=setTimeout(()=>finish(null),5000);
    window.addEventListener('message',receive);
    try{window.top.postMessage(Object.assign({type:'flair-login-request',nonce,id,action},details||{}),'https://shloimyusb.github.io');}catch(error){finish(null);}
  });
}
async function savedLoginTokens(){
  if(loginHostNonce()){
    const result=await loginHostRequest('read');
    return result && result.ok && Array.isArray(result.tokens)?[...new Set(result.tokens.filter(t=>typeof t==='string' && t))]:[];
  }
  return localLoginTokens();
}
async function forgetLoginToken(token){
  clearLocalLoginToken(token);await loginHostRequest('forget',{token});
}
async function clearLoginToken(){
  clearLocalLoginToken();await loginHostRequest('clear');
}
async function storeLoginToken(token,remember){
  clearLocalLoginToken();
  if(loginHostNonce()){const result=await loginHostRequest('store',{token,remember:!!remember});return !!(result && result.ok && result.saved);}
  try {const storage=window[remember?'localStorage':'sessionStorage'];storage.setItem('flairInventoryToken',token);return storage.getItem('flairInventoryToken')===token;}catch(e){return false;}
}
async function allowLoginFrame(){
  if(loginHostNonce()){const reply=await loginHostRequest('ping');return !!(reply && reply.ok);}
  try {
    const ancestors=window.location.ancestorOrigins;
    if(ancestors)return Array.from(ancestors).every(origin=>/^https:\/\/([a-z0-9-]+-script\.googleusercontent\.com|script\.google\.com)$/.test(origin));
    return window.top===window.parent.parent;
  }catch(error){return false;}
}
async function restoreLogin(){
  $('retrySavedLoginBtn').classList.add('hidden');$('savedLoginNotice').classList.add('hidden');
  $('restoreStatus').textContent='Restoring your saved login…';
  const tokens=await savedLoginTokens();if(!tokens.length){state.token='';return false;}
  $('loginForm').classList.add('hidden');$('restoreStatus').classList.remove('hidden');
  for(const token of tokens){
    state.token=token;
    try{await bootstrap();return true;}catch(error){
      if(/session has expired|access has been revoked/i.test(error.message)){await forgetLoginToken(token);continue;}
      showLogin();$('loginForm').classList.add('hidden');$('retrySavedLoginBtn').classList.remove('hidden');
      $('savedLoginNotice').textContent='Your saved sign-in is still here. The app could not connect. Try again.';$('savedLoginNotice').classList.remove('hidden');
      return true;
    }
  }
  state.token='';return false;
}
const call = (fn, ...args) => new Promise((resolve, reject) => {
  google.script.run.withSuccessHandler(resolve).withFailureHandler(err => reject(new Error(err.message || err)))[fn](...args);
});

window.addEventListener('load', async () => {
  bindEvents();
  if(window.matchMedia('(max-width:720px)').matches)$('displayOptions').open=false;
  window.addEventListener('message', handleScannerMessage);
  if(!await allowLoginFrame()){
    $('loginForm').classList.add('hidden');$('restoreStatus').textContent='Open Flair Inventory directly to sign in.';$('restoreStatus').classList.remove('hidden');return;
  }
  $('stableLoginLink').classList.toggle('hidden',!!loginHostNonce());
  if(await restoreLogin())return;
  showLogin();
});

function bindEvents(){
  $('loginForm').addEventListener('submit', login);
  $('retrySavedLoginBtn').addEventListener('click',async()=>{if(!await restoreLogin())showLogin();});
  $('logoutBtn').addEventListener('click', logout);
  document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
  document.querySelectorAll('.category-btn').forEach(b=>b.addEventListener('click',()=>switchCategory(b.dataset.category)));
  $('searchInput').addEventListener('input', debounce(applyInventoryFilters,80));
  $('bayFilter').addEventListener('change', applyInventoryFilters);
  $('locationFilter').addEventListener('change', applyInventoryFilters);
  $('sortOrder').addEventListener('change', applyInventoryFilters);
  $('inventoryViewMode').addEventListener('change',()=>{setInventoryView($('inventoryViewMode').value);applyCardSize();});
  $('cardSize').addEventListener('input',()=>{state.cardSize=validCardSize($('cardSize').value);applyCardSize();});
  $('cardSize').addEventListener('change',saveCardSize);
  $('refreshBtn').addEventListener('click',()=>loadInventory(true));
  $('historyRefreshBtn').addEventListener('click',()=>loadHistory(true));
  $('inventoryGrid').addEventListener('click',handleInventoryAction);
  $('addRollBtn').addEventListener('click',openRollDialog);
  $('saveRollBtn').addEventListener('click',saveRoll);
  document.querySelectorAll('.segment').forEach(b=>b.addEventListener('click',()=>setAdjustAction(b.dataset.action)));
  $('saveAdjustBtn').addEventListener('click',saveAdjustment);
  $('moveForm').addEventListener('submit',saveMove);
  document.querySelectorAll('[data-close-move]').forEach(b=>b.addEventListener('click',()=>$('moveDialog').close()));
  $('scanBtn').addEventListener('click',openScanner);
}

async function login(e){
  e.preventDefault();
  setBusy(e.submitter,true,'Signing in…');
  try{
    const result = await call('loginUser',$('loginEmail').value,$('loginPin').value,$('rememberMe').checked);
    state.token=result.token; state.user=result.user;
    const saved=await storeLoginToken(state.token,result.remembered);
    $('sessionSaveNotice').classList.toggle('hidden',saved);
    $('loginPin').value='';
    await bootstrap();
  }catch(err){toast(err.message,true)}finally{setBusy(e.submitter,false,'Sign in')}
}

async function bootstrap(){
  const data = await call('getAppBootstrap',state.token);
  state.loadedCategories={carpet:{items:data.inventory||[],loadedAt:Date.now()}};
  for(const [category,items] of Object.entries(data.preloadedInventory||{}))if(['tile','vinyl'].includes(category) && Array.isArray(items))state.loadedCategories[category]={items,loadedAt:Date.now()};
  state.pendingCategories={};
  state.categoryRevisions={};
  state.user=data.user; state.carpetSheets=data.carpetSheets||[]; state.scannerUrl=data.scannerUrl||'';
  state.viewMode=readInventoryView(state.user.email);$('inventoryViewMode').value=state.viewMode;
  state.cardSize=readCardSize(state.user.email);
  if(loginHostNonce()){
    const preferences=await loginHostRequest('read-card-size',{email:state.user.email});
    if(preferences && preferences.ok){state.cardSize=validCardSize(preferences.size);if(['cards','compact','table'].includes(preferences.view))state.viewMode=preferences.view;}
  }
  $('inventoryViewMode').value=state.viewMode;
  state.historyCache=null;state.historyPending=null;state.historyRevision++;
  applyCardSize();
  state.inventorySheets=data.inventorySheets||{carpet:state.carpetSheets};
  state.vinylConfigured=!!data.vinylConfigured;
  $('testBanner').classList.toggle('hidden',data.environment==='production');
  if(state.scannerUrl){const url=new URL(state.scannerUrl);url.searchParams.set('returnUrl',loginHostNonce()?'https://shloimyusb.github.io/flair-inventory-app/app.html':data.appUrl);$('scanBtn').href=url.toString();}
  $('userName').textContent=state.user.name;
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
  switchView('inventory');
  populateRollSheets();
  const scan=[$('initialScanCode').value,$('initialScanThickness').value].filter(Boolean).join(' ');
  if(scan){switchCategory('vinyl');$('searchInput').value=scan;$('initialScanCode').value='';$('initialScanThickness').value='';}
  else {await switchCategory('carpet');}
  // Warm the other tabs while the employee is viewing the first category.
  if(!state.loadedCategories.tile)fetchInventoryCategory('tile',false).catch(()=>{});
  if(state.vinylConfigured && !state.loadedCategories.vinyl)fetchInventoryCategory('vinyl',false).catch(()=>{});
  window.scrollTo(0,0);
}

function showLogin(){ $('loginForm').classList.remove('hidden');$('restoreStatus').classList.add('hidden');$('loginView').classList.remove('hidden'); $('appView').classList.add('hidden'); }
async function logout(){
  const token=state.token;state.token='';state.user=null;state.inventoryRequest++;state.historyRevision++;
  state.loadedCategories={};state.pendingCategories={};state.allInventory=[];state.inventory=[];state.historyCache=null;state.historyPending=null;
  for(const id of ['adjustDialog','rollDialog','moveDialog'])$(id).close();
  $('inventoryGrid').innerHTML='';$('historyList').innerHTML='';$('rememberMe').checked=false;
  await clearLoginToken();showLogin();
  try{await call('logoutUser',token)}catch(e){toast('Saved sign-in cleared here. Server sign-out could not connect; try signing out again when connected.',true);}
}

function switchView(view){
  document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view));});
  $('inventoryView').classList.toggle('hidden',view!=='inventory'); $('historyView').classList.toggle('hidden',view!=='history');
  if(view==='history') loadHistory();
}

function switchCategory(category){
  state.category=category; $('searchInput').value='';
  $('bayFilter').value='';$('locationFilter').value='';state.allInventory=[];
  document.querySelectorAll('.category-btn').forEach(b=>{b.classList.toggle('active',b.dataset.category===category);b.setAttribute('aria-pressed',String(b.dataset.category===category));});
  $('addRollBtn').classList.toggle('hidden',category!=='carpet' || state.user.role==='view');
  $('scanBtn').classList.toggle('hidden',category!=='vinyl');
  return loadInventory(false);
}

async function loadInventory(force){
  const requestId=++state.inventoryRequest,category=state.category;
  if(category==='vinyl' && !state.vinylConfigured){state.inventory=[];state.allInventory=[];populateBayFilter();populateLocationFilter([]);$('bayFilter').disabled=true;$('locationFilter').disabled=true;$('statusLine').textContent='Vinyl sheet not connected yet.';$('filterSummary').textContent='';$('inventoryGrid').innerHTML='<div class="card empty-state"><span class="empty-symbol" aria-hidden="true">◇</span><strong>Vinyl is ready for its sheet</strong><p>Vinyl inventory will be available when its Google Sheet is connected. You can still test the label scanner.</p></div>';return}
  const loaded=state.loadedCategories[category];
  if(loaded){
    state.allInventory=loaded.items;populateBayFilter();$('bayFilter').disabled=false;$('locationFilter').disabled=false;applyInventoryFilters();
    if(!force && Date.now()-loaded.loadedAt<120000)return;
    $('statusLine').textContent+=force?' · Refreshing…':' · Checking for updates…';
  } else {
    state.inventory=[];state.allInventory=[];populateBayFilter();populateLocationFilter([]);$('bayFilter').disabled=true;$('locationFilter').disabled=true;
    $('inventoryGrid').innerHTML='<div class="card loading-card" role="status"><span class="muted">Loading '+esc(category)+' inventory…</span><span class="skeleton title"></span><span class="skeleton amount"></span><span class="skeleton block"></span></div>';
    $('statusLine').textContent='Loading…';
  }
  try{
    const items=await fetchInventoryCategory(category,!!force);
    if(requestId!==state.inventoryRequest || category!==state.category)return;
    state.allInventory=items;populateBayFilter();$('bayFilter').disabled=false;$('locationFilter').disabled=false;applyInventoryFilters();
  }catch(err){
    if(requestId!==state.inventoryRequest || category!==state.category)return;
    $('statusLine').textContent=loaded?'Showing previously loaded inventory · Refresh failed':'Could not load '+category+' inventory. Try Refresh.';
    toast(err.message,true);
  }
}

function fetchInventoryCategory(category,force){
  const pending=state.pendingCategories[category];
  if(pending){
    if(!force || pending.force)return pending.promise;
    return pending.promise.catch(()=>{}).then(()=>fetchInventoryCategory(category,true));
  }
  const token=state.token,revision=state.categoryRevisions[category]||0,job={force:!!force};
  state.pendingCategories[category]=job;
  job.promise=call('getInventory',token,category,'',!!force).then(items=>{
    if(state.token!==token)throw new Error('Session changed. Please sign in again.');
    if((state.categoryRevisions[category]||0)!==revision && state.loadedCategories[category])return state.loadedCategories[category].items;
    // Keep completed preloads even if the employee has moved to another tab.
    state.loadedCategories[category]={items,loadedAt:Date.now()};return items;
  }).finally(()=>{if(state.pendingCategories[category]===job)delete state.pendingCategories[category];});
  return job.promise;
}

function populateBayFilter(){
  const selected=$('bayFilter').value;
  const counts=new Map();state.allInventory.forEach(item=>{if(item.sourceSheet)counts.set(item.sourceSheet,(counts.get(item.sourceSheet)||0)+1);});
  const bays=[...counts.keys()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
  $('bayFilter').innerHTML='<option value="">All bays</option>'+bays.map(bay=>`<option value="${escAttr(bay)}">${esc(bay)} (${counts.get(bay)})</option>`).join('');
  $('bayFilter').value=bays.includes(selected)?selected:'';
}

function applyInventoryFilters(){
  if(state.category==='vinyl' && !state.vinylConfigured)return;
  const bay=$('bayFilter').value,terms=$('searchInput').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const bayItems=state.allInventory.filter(item=>!bay || item.sourceSheet===bay);
  populateLocationFilter(bayItems);
  const location=$('locationFilter').value;
  state.inventory=bayItems.filter(item=>(!location || locationKey(item)===location) && terms.every(term=>inventorySearchText(item).includes(term)));
  const sort=$('sortOrder').value;state.inventory.sort((a,b)=>compareInventoryItems(a,b,sort));
  state.visibleCount=60;
  renderInventory();
  $('statusLine').textContent=`${state.inventory.length} of ${state.allInventory.length} ${state.category} item${state.inventory.length===1?'':'s'}${bay?' · '+bay:''}${location?' · Location '+(location==='__NO_LOCATION__'?'not set':location):''}`;
  $('filterSummary').textContent=[bay,location==='__NO_LOCATION__'?'No location':location,terms.length?'Search active':''].filter(Boolean).join(' · ');
}

function inventorySearchText(item){
  if(!searchTextCache.has(item))searchTextCache.set(item,JSON.stringify(item).toLowerCase());
  return searchTextCache.get(item);
}

function locationKey(item){return String(item.location||'').trim() || '__NO_LOCATION__';}
function populateLocationFilter(items){
  const selected=$('locationFilter').value;
  const counts=new Map();items.forEach(item=>{const key=locationKey(item);counts.set(key,(counts.get(key)||0)+1);});
  const locations=[...counts.keys()].sort((a,b)=>a==='__NO_LOCATION__'?1:b==='__NO_LOCATION__'?-1:a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}));
  $('locationFilter').innerHTML='<option value="">All locations</option>'+locations.map(location=>`<option value="${escAttr(location)}">${location==='__NO_LOCATION__'?'Not set':esc(location)} (${counts.get(location)})</option>`).join('');
  $('locationFilter').value=locations.includes(selected)?selected:'';
}
function compareInventoryItems(a,b,mode){
  const byName=()=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'});
  if(mode.startsWith('quantity-')){
    const aq=Number.isFinite(a.quantity)?a.quantity:null,bq=Number.isFinite(b.quantity)?b.quantity:null;
    if(aq===null || bq===null)return aq===bq?byName():aq===null?1:-1;
    return (mode==='quantity-desc'?bq-aq:aq-bq) || byName();
  }
  if(mode.startsWith('location-')){
    const direction=mode==='location-desc'?-1:1;
    const ab=String(a.sourceSheet||'').trim(),bb=String(b.sourceSheet||'').trim();
    if(!ab || !bb){if(ab!==bb)return !ab?1:-1;}
    const bayOrder=ab.localeCompare(bb,undefined,{numeric:true,sensitivity:'base'});
    if(bayOrder)return direction*bayOrder;
    const al=String(a.location||'').trim(),bl=String(b.location||'').trim();
    if(!al || !bl)return al===bl?byName():!al?1:-1;
    return direction*al.localeCompare(bl,undefined,{numeric:true,sensitivity:'base'}) || byName();
  }
  return (mode==='name-desc'?-1:1)*byName();
}

function inventoryViewKey(email){return 'flairInventoryView:'+String(email||'').trim().toLowerCase();}
function validCardSize(value){const size=Number(value);return Number.isFinite(size) && size>=140 && size<=440?Math.round(size/5)*5:285;}
function cardSizeKey(email){return 'flairInventoryCardSize:'+String(email||'').trim().toLowerCase();}
function readCardSize(email){try{return validCardSize(window.localStorage.getItem(cardSizeKey(email)));}catch(error){return 285;}}
async function saveCardSize(){
  const size=validCardSize(state.cardSize);
  try{window.localStorage.setItem(cardSizeKey(state.user.email),String(size));}catch(error){}
  if(loginHostNonce())await loginHostRequest('write-card-size',{email:state.user.email,size});
}
function applyCardSize(){
  const grid=$('inventoryGrid'),size=validCardSize(state.cardSize),small=size<=220,wasSmall=grid.classList.contains('cards-small');
  $('cardSizeControl').classList.toggle('hidden',state.viewMode!=='cards');
  $('cardSize').value=size;
  $('cardSizeValue').textContent=size<=220?'Small':size>340?'Large':'Standard';
  grid.style.setProperty('--card-width',size+'px');
  grid.style.setProperty('--card-padding',Math.max(9,Math.min(22,Math.round(size/285*16)))+'px');
  grid.style.setProperty('--card-title-size',Math.max(12,Math.min(20,Math.round(size/285*17)))+'px');
  grid.style.setProperty('--card-qty-size',Math.max(19,Math.min(34,Math.round(size/285*28)))+'px');
  grid.classList.toggle('cards-small',small);
  if(wasSmall!==small)grid.querySelectorAll('.card-extra').forEach(details=>details.open=!small);
}
function readInventoryView(email){
  try {const value=window.localStorage.getItem(inventoryViewKey(email));return ['cards','compact','table'].includes(value)?value:'cards';}catch(error){return 'cards';}
}
function setInventoryView(value){
  state.viewMode=['cards','compact','table'].includes(value)?value:'cards';
  $('inventoryViewMode').value=state.viewMode;
  try {window.localStorage.setItem(inventoryViewKey(state.user.email),state.viewMode);}catch(error){}
  if(loginHostNonce())loginHostRequest('write-view',{email:state.user.email,view:state.viewMode});
  if(state.loadedCategories[state.category])renderInventory();
}

function inventoryQuantity(item){
  if(item.category==='carpet')return {qty:`${esc(item.quantityDisplay||'—')} <small>ft</small>`,sub:item.quantityMode==='dimension'?'Dimension-format remnant':''};
  return {qty:`${esc(item.boxes??'—')} <small>boxes</small>`,sub:item.totalSf!=null?`${fmt(item.totalSf)} SF total${item.sfPerBox?` · ${fmt(item.sfPerBox)} SF/box`:''}`:''};
}
function inventoryMeta(item){
  const meta=[];
  if(item.sku)meta.push(['SKU',item.sku]);if(item.code)meta.push(['Code',item.code]);if(item.thickness)meta.push(['Thickness',item.thickness]);
  meta.push(['Location',item.location||'Not set']);if(item.sourceSheet)meta.push(['Bay',item.sourceSheet]);
  if(item.bay)meta.push(['Bay notes',item.bay]);if(item.category==='tile')meta.push(['Right / Left',item.side||'Not set']);if(item.grout)meta.push(['Grout',item.grout]);
  if(item.category==='carpet'){meta.push(['Confirmed',String(item.confirmed).toLowerCase()==='true'?'Yes':'Not yet']);if(item.timestamp)meta.push(['Sheet date',item.timestamp]);}
  return meta;
}
function inventoryMetaField(item,label,value){
  return ['Location','Bay','Bay notes','Right / Left'].includes(label) && state.user.role!=='view'?`<button type="button" class="meta-edit" data-move="${escAttr(label)}" aria-label="Change ${escAttr(label.toLowerCase())} for ${escAttr(item.name)}"><b>${esc(label)} <span aria-hidden="true">✎</span></b>${esc(value)}</button>`:`<div><b>${esc(label)}</b>${esc(value)}</div>`;
}
function inventoryActions(item){
  if(state.user.role==='view')return '<span class="muted">View only</span>';
  return `<div class="card-actions"><button type="button" class="btn secondary" data-adjust="add">+ Add</button><button type="button" class="btn ghost" data-adjust="subtract">− Subtract</button></div>${item.category==='carpet'?`<button type="button" class="btn ghost confirm-action" data-confirm>${String(item.confirmed).toLowerCase()==='true'?'✓ Confirm again':'✓ Confirm carpet'}</button>`:''}`;
}
function handleInventoryAction(event){
  const button=event.target.closest('[data-move],[data-adjust],[data-confirm]');
  if(!button || button.disabled)return;
  const container=button.closest('[data-item-id]');
  const item=container && state.inventory.find(row=>row.id===container.dataset.itemId);
  if(!item)return;
  if(button.hasAttribute('data-move'))openMove(item,button.dataset.move);
  else if(button.hasAttribute('data-adjust'))openAdjust(item,button.dataset.adjust);
  else saveCarpetConfirmation(item,button);
}
function renderInventoryTable(grid){
  const wrap=document.createElement('div');wrap.className='inventory-table-wrap';wrap.tabIndex=0;wrap.setAttribute('aria-label','Scrollable inventory table');
  wrap.innerHTML=`<table class="inventory-data-table"><caption>${esc(state.category)} inventory</caption><thead><tr><th scope="col">Item</th><th scope="col">Amount</th><th scope="col">Bay</th><th scope="col">Location</th>${state.category==='tile'?'<th scope="col">Right / Left</th>':''}<th scope="col">Details</th><th scope="col">Actions</th></tr></thead><tbody></tbody></table>`;
  const body=wrap.querySelector('tbody');
  state.inventory.slice(0,state.visibleCount).forEach(item=>{
    const row=document.createElement('tr'),{qty,sub}=inventoryQuantity(item);
    const details=inventoryMeta(item).filter(m=>!['Location','Bay','Right / Left'].includes(m[0]));
    row.innerHTML=`<th scope="row">${esc(item.name)}${item.estimated?'<span class="badge warn">Estimated</span>':''}</th><td><div class="table-qty">${qty}</div>${sub?`<div class="table-sub">${esc(sub)}</div>`:''}</td><td class="table-place">${inventoryMetaField(item,'Bay',item.sourceSheet||'Not set')}</td><td class="table-place">${inventoryMetaField(item,'Location',item.location||'Not set')}</td>${item.category==='tile'?`<td class="table-place">${inventoryMetaField(item,'Right / Left',item.side||'Not set')}</td>`:''}<td>${details.length?`<details><summary>Details</summary><div class="meta">${details.map(m=>inventoryMetaField(item,...m)).join('')}</div></details>`:'—'}</td><td class="table-actions">${inventoryActions(item)}</td>`;
    row.dataset.itemId=item.id;body.appendChild(row);
  });
  const hint=document.createElement('p');hint.className='table-scroll-hint';hint.textContent='Swipe sideways to see all columns.';grid.append(hint,wrap);
}

function renderInventory(){
  const grid=$('inventoryGrid'); grid.className='inventory-grid inventory-'+state.viewMode;grid.innerHTML='';
  applyCardSize();
  if(!state.inventory.length){grid.innerHTML='<div class="card empty-state"><span class="empty-symbol" aria-hidden="true">⌕</span><strong>No matching items</strong><p>Try another name, bay, or location.</p></div>';return}
  const fragment=document.createDocumentFragment();
  if(state.viewMode==='table')renderInventoryTable(grid);
  else state.inventory.slice(0,state.visibleCount).forEach(item=>{
    const card=document.createElement('article'); card.className='card';
    const est=item.estimated?'<span class="badge warn">Estimated</span>':'';
    const {qty,sub}=inventoryQuantity(item),meta=inventoryMeta(item);
    if(sub)card.classList.add('has-subqty');
    const primary=meta.filter(m=>['Location','Bay','Right / Left'].includes(m[0])),extra=meta.filter(m=>!['Location','Bay','Right / Left'].includes(m[0]));
    const metaHtml=state.viewMode==='cards'?`<div class="meta">${primary.map(m=>inventoryMetaField(item,...m)).join('')}</div>${extra.length?`<details class="card-extra" ${state.cardSize>220?'open':''}><summary>Details</summary><div class="meta">${extra.map(m=>inventoryMetaField(item,...m)).join('')}</div></details>`:''}`:`<div class="meta">${meta.map(m=>inventoryMetaField(item,...m)).join('')}</div>`;
    card.innerHTML=`<div class="card-title"><h3>${esc(item.name)}</h3>${est}</div><div class="qty">${qty}</div>${sub?`<div class="subqty">${esc(sub)}</div>`:''}${metaHtml}<div class="inventory-actions">${inventoryActions(item)}</div>`;
    card.dataset.itemId=item.id;
    fragment.appendChild(card);
  });
  grid.appendChild(fragment);
  if(state.inventory.length>state.visibleCount){
    const more=document.createElement('div');more.style.gridColumn='1 / -1';more.className='card inventory-more';
    const info=document.createElement('span');info.textContent=`Showing ${state.visibleCount} of ${state.inventory.length} matching items. Search and filters include all items.`;
    const button=document.createElement('button');button.className='btn secondary';button.textContent='Show more items';button.addEventListener('click',()=>{state.visibleCount+=60;renderInventory();});
    more.append(info,button);grid.appendChild(more);
  }
}

async function saveCarpetConfirmation(item,button){
  const label=button.textContent,token=state.token;setBusy(button,true,'Confirming…');
  try {
    const result=await call('confirmCarpet',token,item.id);
    if(state.token!==token)return;
    applyInventoryUpdate('carpet',result.item);
    toast('Carpet confirmed. Checkbox and sheet date updated.');
  } catch(error){toast(error.message,true);} finally {setBusy(button,false,label);}
}

function openMove(item,field){
  if(state.user.role==='view'){toast('Your account is view-only.',true);return;}
  if(state.moveSaving){toast('Your previous move is still saving.');return;}
  state.moveItem=item;
  $('moveTitle').textContent='Move '+item.name;
  const sheets=[...new Set([...(state.inventorySheets[item.category]||[]),item.sourceSheet])];
  $('moveSheet').innerHTML=sheets.map(s=>`<option value="${escAttr(s)}">${esc(s)}</option>`).join('');
  $('moveSheet').value=item.sourceSheet;$('moveLocation').value=item.location||'';$('moveBay').value=item.bay||'';
  $('moveSideLabel').classList.toggle('hidden',item.category!=='tile');
  $('moveSide').value=item.category==='tile'?String(item.side||'').trim():'';
  $('moveBayLabel').classList.toggle('hidden',item.category!=='carpet' && !Object.hasOwn(item,'bay'));
  $('moveDialog').showModal();
  $(field==='Location'?'moveLocation':field==='Bay notes'?'moveBay':field==='Right / Left'?'moveSide':'moveSheet').focus();
}

async function saveMove(event){
  event.preventDefault();if(state.moveSaving)return;
  const item=state.moveItem,token=state.token,button=$('saveMoveBtn');
  const payload={category:item.category,inventoryId:item.id,sheetName:$('moveSheet').value,location:$('moveLocation').value,bay:$('moveBay').value,expected:{sourceSheet:item.sourceSheet,location:item.location,bay:item.bay||''}};
  if(item.category==='tile'){payload.side=$('moveSide').value;payload.expected.side=item.side||'';}
  state.moveSaving=true;setBusy(button,true,'Saving…');
  try {
    const result=await call('moveInventory',token,payload);
    if(state.token!==token)return;
    applyInventoryUpdate(item.category,result.item);
    $('moveDialog').close();
    toast(result.unchanged?'Location is already up to date.':`Saved: ${result.item.sourceSheet} · Location ${result.item.location||'not set'}${item.category==='tile'?' · '+(result.item.side||'Right / Left not set'):''}.`);
  }catch(error){toast(error.message,true);}finally{state.moveSaving=false;setBusy(button,false,'Save location');}
}

function openAdjust(item,action){
  if(state.user.role==='view'){toast('Your account is view-only.',true);return}
  if(state.adjustSaving){toast('Your adjustment is still saving.');return;}
  state.adjustItem=item; setAdjustAction(action);
  $('adjustTitle').textContent=`Adjust ${item.name}`;
  $('adjustAmount').value=''; $('adjustReason').value=''; $('adjustNotes').value='';
  $('adjustAmount').step=item.category==='carpet'?'0.01':'1';
  $('adjustAmount').min=item.category==='carpet'?'0.01':'1';
  $('adjustCurrent').innerHTML=`Current: <strong>${item.category==='carpet'?esc(item.quantityDisplay||'—')+' ft':`${item.boxes??'—'} boxes${item.totalSf!=null?` (${fmt(item.totalSf)} SF)`:''}`}</strong>`;
  $('adjustDialog').showModal();
}
function setAdjustAction(action){state.adjustAction=action;document.querySelectorAll('.segment').forEach(b=>b.classList.toggle('active',b.dataset.action===action))}

async function saveAdjustment(){
  if(state.adjustSaving || !$('adjustForm').reportValidity())return;
  const btn=$('saveAdjustBtn'),item=state.adjustItem,token=state.token,amount=Number($('adjustAmount').value);
  if(!Number.isFinite(amount)||amount<=0){toast('Enter a quantity greater than zero.',true);return}
  state.adjustSaving=true;
  setBusy(btn,true,'Saving…');
  try{
    const result=await call('adjustInventory',token,{category:item.category,inventoryId:item.id,action:state.adjustAction,amount,reason:$('adjustReason').value,notes:$('adjustNotes').value});
    if(state.token!==token)return;
    $('adjustDialog').close();toast(`Updated from ${result.before} to ${result.after}.`);
    applyInventoryUpdate(item.category,result.item);
  }catch(err){toast(err.message,true)}finally{state.adjustSaving=false;setBusy(btn,false,'Save adjustment')}
}

function populateRollSheets(){
  $('rollSheet').innerHTML=state.carpetSheets.map(s=>`<option value="${escAttr(s)}">${esc(s)}</option>`).join('');
}
function openRollDialog(){ if(state.user.role==='view'){toast('Your account is view-only.',true);return}if(state.rollSaving){toast('Your roll is still saving.');return;} $('rollForm').reset(); populateRollSheets(); $('rollDialog').showModal(); }
async function saveRoll(){
  if(state.rollSaving || !$('rollForm').reportValidity())return;
  const btn=$('saveRollBtn'),token=state.token;state.rollSaving=true;setBusy(btn,true,'Adding…');
  try{
    const result=await call('addCarpetRoll',token,{name:$('rollName').value,sheetName:$('rollSheet').value,location:$('rollLocation').value,bay:$('rollBay').value,originalQty:Number($('rollOriginal').value),currentQty:Number($('rollCurrent').value),estimated:$('rollEstimated').checked,price:$('rollPrice').value,sample:$('rollSample').value,reprice:$('rollReprice').value,photo:$('rollPhoto').value,confirmed:$('rollConfirmed').checked,notes:$('rollNotes').value});
    if(state.token!==token)return;
    $('rollDialog').close();toast(`${result.name} added to ${result.sheetName}.`);applyInventoryUpdate('carpet',result.item);
  }catch(err){toast(err.message,true)}finally{state.rollSaving=false;setBusy(btn,false,'Add roll')}
}

function invalidateHistory(){state.historyCache=null;state.historyRevision++;}
function applyInventoryUpdate(category,item){
  invalidateHistory();
  state.categoryRevisions[category]=(state.categoryRevisions[category]||0)+1;
  if(!item){delete state.loadedCategories[category];if(state.category===category)loadInventory(true);return;}
  const cached=state.loadedCategories[category];
  if(cached){const found=cached.items.some(row=>row.id===item.id);cached.items=found?cached.items.map(row=>row.id===item.id?item:row):[...cached.items,item];}
  if(state.category===category){
    const found=state.allInventory.some(row=>row.id===item.id);
    state.allInventory=found?state.allInventory.map(row=>row.id===item.id?item:row):[...state.allInventory,item];
    const visible=state.visibleCount;populateBayFilter();applyInventoryFilters();
    if(visible>state.visibleCount){state.visibleCount=visible;renderInventory();}
  }
}
function renderHistory(rows){
  $('historyList').innerHTML=rows.length?rows.map(r=>`<div class="history-row"><div><strong>${esc(r.product)}</strong><br><span class="muted">${esc(r.timestamp)} · ${esc(r.category)}</span></div><div><span class="history-action">${esc(r.action)}</span><br><span class="muted">${esc(r.amount)} ${esc(r.unit)}</span></div><div class="history-change">${esc(r.before)} <span class="muted">→</span> ${esc(r.after)}</div><div>${esc(r.employee)}</div><div>${esc(r.sourceSheet)}</div></div>`).join(''):'<div class="card empty-state"><strong>No adjustments yet</strong><p>Inventory changes will appear here.</p></div>';
}
async function loadHistory(force){
  const token=state.token,revision=state.historyRevision,cache=state.historyCache;
  if(cache){renderHistory(cache.rows);if(!force && Date.now()-cache.loadedAt<60000)return;}
  else $('historyList').innerHTML='<div class="history-row" role="status">Loading recent activity…</div>';
  setBusy($('historyRefreshBtn'),true,'Refreshing…');
  try{
    let job=state.historyPending;
    if(!job || job.token!==token || job.revision!==revision){
      job={token,revision,promise:call('getHistory',token,200)};state.historyPending=job;
      job.promise.finally(()=>{if(state.historyPending===job)state.historyPending=null;}).catch(()=>{});
    }
    const rows=await job.promise;
    if(state.token!==token || state.historyRevision!==revision)return;
    state.historyCache={rows,loadedAt:Date.now()};renderHistory(rows);
  }catch(err){if(state.token===token && state.historyRevision===revision){if(!cache)$('historyList').innerHTML='<div class="card empty-state"><strong>Could not load activity</strong><p>Try Refresh to reconnect.</p></div>';toast(err.message,true);}}
  finally{if(state.token===token && state.historyRevision===revision)setBusy($('historyRefreshBtn'),false,'Refresh');}
}

function openScanner(event){
  if(!state.scannerUrl){event.preventDefault();toast('The camera scanner is not configured yet. You can still search vinyl manually.',true);}
}
function handleScannerMessage(event){
  if(!state.scannerUrl)return;
  let expectedOrigin='';
  try{expectedOrigin=new URL(state.scannerUrl).origin}catch(e){}
  if(expectedOrigin && event.origin!==expectedOrigin)return;
  const data=event.data||{};
  if(data.type!=='flair-vinyl-scan' || event.source!==state.scannerWindow || data.nonce!==state.scanNonce)return;
  const code=String(data.code||'').trim(); const thickness=String(data.thickness||'').trim();
  if(!code && !thickness){toast('No code or thickness was detected.',true);return}
  $('searchInput').value=[code,thickness].filter(Boolean).join(' ');
  toast(`Scanner read ${code||'unknown code'}${thickness?` · ${thickness} mm`:''}.`);
  loadInventory(true);
}

function setBusy(btn,busy,label){if(!btn)return;btn.disabled=busy;btn.textContent=label}
function toast(msg,error){const t=$('toast');t.textContent=msg;t.classList.toggle('error',!!error);t.setAttribute('role',error?'alert':'status');t.classList.remove('hidden');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.add('hidden'),error?6500:3600)}
function debounce(fn,ms){let id;return(...args)=>{clearTimeout(id);id=setTimeout(()=>fn(...args),ms)}}
function fmt(v){return Number(v).toLocaleString(undefined,{maximumFractionDigits:2})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escAttr(v){return esc(v)}
</script>
